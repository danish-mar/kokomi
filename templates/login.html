{% extends "base.html" %}

{% block title %}Login - Kokomi AI{% endblock %}

{% block head %}
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Ambient background pulses */
    .ambient-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: var(--bg-canvas);
        overflow: hidden;
    }

    .blob {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        z-index: -1;
        transition: all 4s ease-in-out;
    }

    .blob-1 {
        background: #505081;
        top: -100px;
        right: -100px;
        animation: pulse-slow 15s infinite alternate;
    }

    .blob-2 {
        background: #8686AC;
        bottom: -150px;
        left: -150px;
        animation: pulse-slow 20s infinite alternate-reverse;
    }

    @keyframes pulse-slow {
        0% { transform: scale(1) translate(0, 0); }
        50% { transform: scale(1.1) translate(50px, -30px); }
        100% { transform: scale(0.9) translate(-20px, 40px); }
    }

    /* Login Card */
    .login-wrapper {
        width: 100%;
        max-width: 400px;
        padding: 20px;
        perspective: 1000px;
    }

    .login-card {
        background: var(--bg-surface);
        backdrop-filter: var(--vibrancy);
        -webkit-backdrop-filter: var(--vibrancy);
        border: 1px solid var(--border);
        border-radius: 32px;
        padding: 40px;
        box-shadow: var(--shadow-lg);
        animation: slideInUpCustom 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: center bottom;
    }

    @keyframes slideInUpCustom {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-area {
        text-align: center;
        margin-bottom: 32px;
    }

    .logo-icon {
        width: 72px;
        height: 72px;
        background: linear-gradient(135deg, var(--accent), #A0A0C8);
        border-radius: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 32px;
        box-shadow: 0 8px 16px rgba(134, 134, 172, 0.3);
        margin-bottom: 16px;
        animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .login-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    .login-subtitle {
        font-size: 14px;
        color: var(--text-tertiary);
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .login-btn {
        background: var(--accent);
        color: var(--accent-text);
        border: none;
        border-radius: 14px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(80, 80, 129, 0.2);
    }

    .login-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(80, 80, 129, 0.3);
    }

    .login-btn:active {
        transform: translateY(0) scale(0.98);
    }

    .error-msg {
        background: rgba(255, 59, 48, 0.1);
        color: #FF3B30;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
    }

</style>
{% endblock %}

{% block body %}
<div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-water"></i>
            </div>
            <h1 class="login-title">Welcome to Kokomi</h1>
            <p class="login-subtitle">Sign in to continue to your workspace</p>
        </div>

        {% if request.query_params.get('error') %}
        <div class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ request.query_params.get('error') }}
        </div>
        {% endif %}

        <form class="login-form" action="/auth/login" method="POST">
            <div class="input-group">
                <label class="apple-label" for="username">Username</label>
                <input class="apple-field" type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="input-group">
                <label class="apple-label" for="password">Password</label>
                <input class="apple-field" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>
        </form>
    </div>
</div>

<script>
    // Subtle mouse tracking for the card
    const card = document.querySelector('.login-card');
    document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        card.style.transition = 'all 0.5s ease';
    });

    document.addEventListener('mouseenter', () => {
        card.style.transition = 'none';
    });
</script>
{% endblock %}
