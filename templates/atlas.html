{% extends "base.html" %}
{% block title %}Atlas Terminal{% endblock %}

{% block head %}
<style>
  /* ── Atlas-specific layout ── */
  #atlas-root {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #atlas-sidebar {
    width: 280px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    background: var(--bg-sidebar);
    backdrop-filter: var(--vibrancy);
    -webkit-backdrop-filter: var(--vibrancy);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--separator);
  }
  .sidebar-brand-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-text);
    font-size: 15px;
    flex-shrink: 0;
  }
  .sidebar-brand-title {
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    line-height: 1.1;
  }
  .sidebar-brand-sub {
    font-size: 10px; font-weight: 500;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .sidebar-section-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-quaternary);
    padding: 14px 16px 6px;
  }

  .sidebar-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
  }

  .wf-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    margin: 1px 6px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    position: relative;
  }
  .wf-item:hover { background: var(--bg-surface-hover); }
  .wf-item:hover .wf-delete { opacity: 1; }
  .wf-item.active {
    background: var(--accent-subtle);
  }
  .wf-item-icon {
    width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .wf-item-title {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wf-item-time {
    font-size: 10px; color: var(--text-quaternary);
    flex-shrink: 0;
  }
  .wf-delete {
    opacity: 0;
    transition: opacity 0.15s;
    padding: 2px 4px;
    border-radius: 5px;
    color: var(--text-tertiary);
    background: transparent;
    border: none; cursor: pointer;
    font-size: 11px;
  }
  .wf-delete:hover { background: rgba(220,60,60,0.12); color: #e05555; }

  .hub-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    margin: 1px 6px;
    cursor: pointer;
    transition: background 0.15s ease;
    font-size: 13px; font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .hub-item:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
  .hub-item.active { background: var(--accent-subtle); color: var(--accent); }
  .hub-item i { width: 18px; text-align: center; color: var(--accent); }

  .sidebar-footer {
    border-top: 1px solid var(--separator);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .admin-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--accent-text); font-weight: 600;
    flex-shrink: 0;
  }
  .admin-name {
    flex: 1; font-size: 13px; font-weight: 600;
    color: var(--text-primary);
  }
  .admin-role { font-size: 10px; color: var(--text-tertiary); }
  .gear-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-tertiary); font-size: 14px; padding: 4px;
    border-radius: 7px; transition: background 0.15s, color 0.15s;
  }
  .gear-btn:hover { background: var(--bg-surface-hover); color: var(--accent); }

  /* ── Main panel ── */
  #atlas-main {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; overflow: hidden;
  }

  /* ── Topbar ── */
  #atlas-topbar {
    height: 64px; min-height: 64px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-sidebar);
    backdrop-filter: var(--vibrancy);
    -webkit-backdrop-filter: var(--vibrancy);
  }
  .topbar-title {
    flex: 1; font-size: 15px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--text-primary);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .status-pending { background: rgba(180,140,40,0.12); color: #b8922a; }
  .dark .status-pending { background: rgba(220,170,50,0.15); color: #d4ab45; }
  .status-running { background: rgba(50,140,200,0.12); color: #2a7fc8; }
  .dark .status-running { background: rgba(80,160,220,0.15); color: #5aabdd; }
  .status-completed { background: rgba(40,180,100,0.12); color: #28a860; }
  .dark .status-completed { background: rgba(50,200,110,0.15); color: #3cc87a; }
  .status-failed { background: rgba(220,60,60,0.1); color: #d03a3a; }
  .dark .status-failed { background: rgba(240,80,80,0.15); color: #e05555; }

  .model-select-wrap {
    position: relative; flex-shrink: 0;
  }
  .model-select {
    appearance: none;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 12px; font-weight: 500;
    padding: 6px 26px 6px 10px;
    cursor: pointer;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .model-select:focus { outline: none; border-color: var(--accent); }
  .model-select-wrap::after {
    content: "\f078";
    font-family: "Font Awesome 6 Free"; font-weight: 900;
    font-size: 9px; color: var(--text-tertiary);
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    pointer-events: none;
  }

  .topbar-btn {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 12px;
    font-size: 12px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px;
    white-space: nowrap; flex-shrink: 0;
  }
  .topbar-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
  .topbar-btn.active { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent); }

  /* ── Content area ── */
  #atlas-content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 20px;
  }

  /* ── Input bar ── */
  #atlas-inputbar {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    background: var(--bg-sidebar);
    backdrop-filter: var(--vibrancy);
    -webkit-backdrop-filter: var(--vibrancy);
  }
  .input-wrap {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-subtle);
  }
  .atlas-input {
    flex: 1; background: none; border: none; outline: none;
    resize: none; overflow-y: hidden;
    min-height: 24px; max-height: 120px;
    font-size: 14px; color: var(--text-primary);
    font-family: inherit; line-height: 1.5;
    padding: 0;
  }
  .atlas-input::placeholder { color: var(--text-quaternary); }
  .input-action-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-tertiary); font-size: 15px; padding: 2px 4px;
    border-radius: 7px; transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .input-action-btn:hover { color: var(--accent); background: var(--accent-subtle); }
  .submit-btn {
    background: var(--accent); border: none; cursor: pointer;
    color: var(--accent-text); font-size: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .submit-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
  .submit-btn:active { transform: scale(0.95); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── Cards ── */
  .atlas-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(var(--material-blur));
    -webkit-backdrop-filter: blur(var(--material-blur));
    transition: all 0.25s ease;
  }

  /* ── Task grid ── */
  .task-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .task-card {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative; overflow: hidden;
  }
  .task-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    background: var(--bg-surface-hover);
  }
  .task-card.status-running-card {
    border-color: #2a7fc8;
    box-shadow: 0 0 0 1px rgba(42, 127, 200, 0.3), 0 4px 16px rgba(42, 127, 200, 0.15);
    animation: runningGlow 2s infinite ease-in-out;
  }
  .dark .task-card.status-running-card {
    border-color: #5aabdd;
    box-shadow: 0 0 0 1px rgba(90,171,221,0.35), 0 4px 18px rgba(90,171,221,0.18);
  }
  .task-card.status-running-card::after {
    content: "";
    position: absolute; top: 0; left: -100%; width: 60px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    animation: shimmerSweep 2s infinite ease-in-out;
  }
  .task-card.status-completed-card { border-color: rgba(40,168,96,0.4); }
  .task-card.status-failed-card { border-color: rgba(208,58,58,0.4); }

  @keyframes runningGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(42,127,200,0.3), 0 4px 16px rgba(42,127,200,0.1); }
    50% { box-shadow: 0 0 0 2px rgba(42,127,200,0.5), 0 6px 24px rgba(42,127,200,0.25); }
  }
  @keyframes shimmerSweep {
    0% { left: -80px; }
    100% { left: calc(100% + 80px); }
  }

  .task-worker-icon {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-bottom: 10px; flex-shrink: 0;
  }
  .task-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-primary); margin-bottom: 4px;
    line-height: 1.3;
  }
  .task-desc {
    font-size: 11.5px; color: var(--text-tertiary);
    line-height: 1.4; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .task-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; gap: 6px;
  }

  /* ── Console ── */
  .atlas-console {
    background: #0d0c1a;
    border: 1px solid rgba(134,134,172,0.18);
    border-radius: 14px;
    padding: 14px;
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 12px;
    max-height: 280px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .dark .atlas-console { background: #080715; }
  .console-line {
    display: flex; gap: 10px;
    padding: 1.5px 0;
    animation: slideInConsole 0.2s ease-out;
  }
  @keyframes slideInConsole {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .console-ts { color: rgba(134,134,172,0.5); flex-shrink: 0; }
  .console-msg-info { color: #7ec8e3; }
  .console-msg-success { color: #5dd87d; }
  .console-msg-error { color: #e06060; }
  .console-msg-warning { color: #d4a542; }
  .console-msg-default { color: #c5c4dd; }

  /* Debug terminal */
  .debug-console {
    background: #0a0f0a;
    border: 1px solid rgba(80,200,80,0.2);
    border-radius: 14px;
    padding: 14px;
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 11px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .debug-line { color: #4cce6a; padding: 1px 0; }
  .debug-ts { color: rgba(76,206,106,0.45); margin-right: 8px; }

  /* ── Tabs ── */
  .atlas-tabs {
    display: flex; gap: 4px;
    margin-bottom: 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
  }
  .atlas-tab {
    flex: 1; padding: 7px 12px;
    border-radius: 9px;
    font-size: 12px; font-weight: 500;
    color: var(--text-tertiary);
    cursor: pointer; transition: all 0.15s;
    text-align: center;
    background: none; border: none;
  }
  .atlas-tab.active {
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: var(--shadow-sm);
  }
  .atlas-tab:hover:not(.active) { color: var(--text-secondary); }

  /* ── File row ── */
  .file-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .file-row:hover { background: var(--bg-surface-hover); }
  .file-icon { width: 30px; text-align: center; font-size: 16px; flex-shrink: 0; }
  .file-name { flex: 1; font-size: 13px; color: var(--text-primary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { font-size: 11px; color: var(--text-quaternary); flex-shrink: 0; }
  .file-dl { color: var(--accent); font-size: 12px; flex-shrink: 0; text-decoration: none; }
  .file-dl:hover { text-decoration: underline; }

  /* ── Nautilus File Explorer ── */
  .nautilus-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    gap: 12px;
  }
  .nautilus-breadcrumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nautilus-breadcrumbs::-webkit-scrollbar {
    display: none;
  }
  .breadcrumb-pill {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .breadcrumb-pill:hover {
    background: var(--bg-surface-hover);
    color: var(--text-primary);
  }
  .breadcrumb-pill.active {
    font-weight: 600;
    color: var(--text-primary);
  }
  .breadcrumb-divider {
    font-size: 11px;
    color: var(--text-quaternary);
    user-select: none;
  }
  
  .nautilus-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 16px;
    padding: 8px 4px;
  }
  .nautilus-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    user-select: none;
    aspect-ratio: 1;
  }
  .nautilus-item:hover {
    background: var(--bg-surface-hover);
    border-color: var(--border);
  }
  .nautilus-item-icon {
    font-size: 40px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
  }
  .nautilus-item-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .nautilus-item-size {
    font-size: 10px;
    color: var(--text-quaternary);
    margin-top: 2px;
  }

  /* ── Templates grid ── */
  .template-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: all 0.2s ease;
  }
  .template-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .tool-badge {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    background: var(--accent-subtle);
    color: var(--accent);
    border-radius: 20px;
    font-size: 10px; font-weight: 500;
    margin: 2px;
  }

  /* ── Suggestion cards ── */
  .suggestion-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .suggestion-card:hover {
    background: var(--bg-surface-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--border-focus);
  }
  .suggestion-card:active { transform: scale(0.98); }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .modal-box {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    max-width: 640px; width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 8px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-tertiary);
    font-size: 12px; transition: all 0.15s;
  }
  .modal-close:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
  .json-block {
    background: #0d0c1a;
    border-radius: 10px; padding: 14px;
    font-family: "SF Mono", monospace; font-size: 11px;
    color: #c5c4dd; overflow-x: auto; max-height: 240px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ── Empty state ── */
  .empty-hero {
    text-align: center;
    padding: 48px 24px 24px;
    max-width: 560px;
    margin: 0 auto;
  }
  .empty-hero-icon {
    width: 72px; height: 72px;
    background: var(--accent-subtle);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: var(--accent);
    margin: 0 auto 20px;
  }

  /* ── Section header ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-tertiary);
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Small action button ── */
  .action-btn-sm {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .action-btn-sm:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
  .action-btn-sm.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .action-btn-sm.primary:hover { background: var(--accent-hover); }
  .action-btn-sm.danger { color: #e05555; }
  .action-btn-sm.danger:hover { background: rgba(220,60,60,0.1); border-color: rgba(220,60,60,0.2); }

  /* ── Goal card ── */
  .goal-card {
    background: linear-gradient(135deg, var(--accent-subtle) 0%, var(--bg-surface) 100%);
    border: 1px solid var(--border-focus);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .goal-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  /* ── Artifacts ── */
  .artifact-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    transition: all 0.15s;
    margin: 4px;
  }
  .artifact-chip:hover { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent); }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.7s linear infinite; display: inline-block; }
  .spinner-sm { animation: spin 0.7s linear infinite; display: inline-block; font-size: 11px; }

  /* ── AI generate loading ── */
  .ai-gen-loading {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-tertiary); font-size: 12px;
  }

  /* Fade in for view switch */
  .atlas-view-enter {
    animation: fadeIn 0.25s ease-out;
  }

  /* Checkbox styled */
  .tool-checkbox { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

  /* ── Live Smartwatch Timer Badge ── */
  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    font-family: 'SF Pro Mono', 'SF Mono', monospace;
    color: var(--text-tertiary);
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5px 5px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .timer-running {
    color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
    border-color: rgba(239, 68, 68, 0.25);
    animation: pulse-timer 1.5s infinite alternate;
  }
  @keyframes pulse-timer {
    0% { opacity: 0.85; }
    100% { opacity: 1; box-shadow: 0 0 4px rgba(239, 68, 68, 0.1); }
  }
  @keyframes simple-ping {
    0% { transform: scale(1); opacity: 1; }
    70% { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* ── Graph View Layout ── */
  .graph-container {
    position: relative;
    width: 100%;
    height: 520px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: auto;
    margin-bottom: 20px;
    padding: 20px;
    cursor: grab;
  }
  .graph-canvas {
    width: 100%;
    min-width: 900px;
    height: 100%;
    min-height: 460px;
    position: relative;
  }
  .graph-node {
    position: absolute;
    width: 160px;
    height: 50px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-canvas);
    display: flex;
    align-items: center;
    padding: 6px 10px;
    cursor: grab;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, left 0.35s cubic-bezier(0.4, 0, 0.2, 1), top 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    z-index: 10;
  }
  .graph-node.dragging {
    transition: none !important;
    z-index: 1000;
    box-shadow: 0 16px 32px rgba(0,0,0,0.4) !important;
    transform: scale(1.05) !important;
    cursor: grabbing;
  }
  .graph-node:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(80, 80, 129, 0.15);
  }
  .graph-node.node-pending {
    border-color: rgba(80, 80, 129, 0.4);
    background: rgba(15, 14, 71, 0.4);
    opacity: 0.85;
  }
  .graph-node.node-waiting {
    border-color: rgba(134, 134, 172, 0.3);
    border-style: dashed;
    background: rgba(15, 14, 71, 0.2);
    opacity: 0.65;
  }
  .graph-node.node-working {
    border-color: var(--accent);
    background: rgba(39, 39, 87, 0.6);
    box-shadow: 0 0 15px rgba(80, 80, 129, 0.4);
    animation: node-pulse-accent 1.5s infinite alternate;
  }
  .graph-node.node-completed {
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.05);
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.1);
  }
  .graph-node.node-failed {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.05);
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
  }
  @keyframes node-pulse-accent {
    0% { border-color: rgba(80, 80, 129, 0.4); box-shadow: 0 0 5px rgba(80, 80, 129, 0.2); }
    100% { border-color: var(--accent); box-shadow: 0 0 15px rgba(80, 80, 129, 0.6); }
  }
  .graph-node-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
    color: white;
    font-size: 11px;
    flex-shrink: 0;
  }
  .graph-node-title {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  /* ── Cyber Intel Loader Styles ── */
  .cyber-loader-box {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: rgba(15, 14, 71, 0.75); /* Obsidian Blue Glassmorphism */
    border: 1px solid rgba(80, 80, 129, 0.4);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(80, 80, 129, 0.15);
  }
  
  .cyber-glow-border {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), #8686AC, transparent);
    animation: border-laser 3s linear infinite;
  }
  @keyframes border-laser {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  .cyber-body {
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .holo-core-container {
    position: relative;
    width: 90px;
    height: 90px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .holo-brain {
    font-size: 34px;
    color: var(--accent);
    z-index: 10;
    text-shadow: 0 0 15px var(--accent);
    animation: brain-float 2s ease-in-out infinite alternate;
  }
  @keyframes brain-float {
    0% { transform: translateY(0); }
    100% { transform: translateY(-6px); }
  }

  .holo-radar-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(134, 134, 172, 0.15);
    animation: radar-pulse 3s infinite linear;
  }
  .holo-radar-ring.ring-1 { width: 50px; height: 50px; animation-delay: 0s; }
  .holo-radar-ring.ring-2 { width: 75px; height: 75px; animation-delay: 1s; }
  .holo-radar-ring.ring-3 { width: 100px; height: 100px; animation-delay: 2s; }
  
  @keyframes radar-pulse {
    0% { transform: scale(0.6); opacity: 0; }
    50% { opacity: 0.6; border-color: var(--accent); }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .cyber-header-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: #8686AC; /* Dusty Lavender */
    letter-spacing: 0.12em;
    padding: 6px 14px;
    background: rgba(39, 39, 87, 0.6); /* Deep Midnight */
    border: 1px solid rgba(80, 80, 129, 0.3);
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .cyber-pulse-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: dot-pulse 1s infinite alternate;
  }
  @keyframes dot-pulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    100% { transform: scale(1.2); opacity: 1; }
  }

  .cyber-step-text {
    font-size: 12.5px;
    font-family: monospace;
    color: white;
    text-align: center;
    background: rgba(15, 14, 71, 0.4);
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(80, 80, 129, 0.2);
    width: 100%;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Zoom Controls Style ── */
  .zoom-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(39, 39, 87, 0.85); /* Deep Midnight */
    border: 1px solid rgba(134, 134, 172, 0.3);
    border-radius: 12px;
    padding: 6px 10px;
    backdrop-filter: blur(10px);
    z-index: 50;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .zoom-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(80, 80, 129, 0.3);
    border: 1px solid rgba(134, 134, 172, 0.25);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .zoom-btn:hover {
    background: rgba(80, 80, 129, 0.6);
    transform: scale(1.05);
  }
  .zoom-btn:active {
    transform: scale(0.95);
  }
  .zoom-text {
    font-size: 11px;
    font-weight: 700;
    color: #8686AC;
    min-width: 36px;
    text-align: center;
    font-family: monospace;
  }

  /* ── Active Worker Badge Styles ── */
  .active-worker-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #0F0E47; /* Obsidian Blue */
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 9px;
    box-shadow: 0 0 10px rgba(80,80,129,0.6);
    z-index: 30;
    animation: badge-pulse-accent 1s infinite alternate;
  }
  .active-worker-badge.waiting-badge {
    color: #8686AC; /* Dusty Lavender */
    border-color: #505081;
    box-shadow: none;
    animation: none;
  }
  @keyframes badge-pulse-accent {
    0% { box-shadow: 0 0 5px rgba(80,80,129,0.4); }
    100% { box-shadow: 0 0 15px rgba(80,80,129,0.8); }
  }

  /* ── Node Artifacts Styles ── */
  .node-artifacts-container {
    position: absolute;
    top: 50px;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto; /* Allow clicking the links */
    z-index: 20;
  }
  .artifact-arrow {
    height: 14px;
    color: var(--text-tertiary);
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2px;
  }
  .node-artifact-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(39, 39, 87, 0.95); /* Deep Midnight */
    border: 1px solid rgba(80, 80, 129, 0.5); /* Muted Indigo */
    border-radius: 8px;
    padding: 4px 8px;
    color: var(--text-primary);
    font-size: 9.5px;
    font-weight: 600;
    max-width: 150px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    text-decoration: none;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .node-artifact-pill:hover {
    transform: translateY(1px) scale(1.02);
    border-color: var(--accent);
    background: rgba(80, 80, 129, 0.4);
    color: white;
  }
</style>
{% endblock %}

{% block body %}
<div id="atlas-root" x-data="atlasApp()" x-init="init()">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside id="atlas-sidebar">
    <!-- Brand -->
    <div class="sidebar-brand">
      <a href="/" class="sidebar-brand-icon" style="text-decoration:none;">
        <i class="fa fa-terminal"></i>
      </a>
      <div>
        <div class="sidebar-brand-title">Atlas</div>
      </div>
    </div>

    <div class="sidebar-scroll">
      <!-- New Workflow -->
      <div style="padding: 10px 10px 4px;">
        <button @click="clearActive()" class="action-btn-sm primary" style="width:100%; justify-content:center; padding:9px 12px; border-radius:12px; font-size:13px;">
          <i class="fa fa-plus"></i> New Workflow
        </button>
      </div>

      <!-- Workflows list -->
      <div class="sidebar-section-label">Workflows</div>
      <template x-if="workflowList.length === 0">
        <div style="padding: 8px 18px; font-size: 12px; color: var(--text-quaternary);">No workflows yet</div>
      </template>
      <template x-for="wf in workflowList" :key="wf.run_id">
        <div class="wf-item" :class="{ active: activeRunId === wf.run_id }" @click="selectWorkflow(wf.run_id)">
          <!-- status icon -->
          <div class="wf-item-icon" :style="wfIconStyle(wf.status)">
            <template x-if="wf.status === 'running'"><i class="fa fa-circle-notch spinner-sm"></i></template>
            <template x-if="wf.status === 'completed'"><i class="fa fa-check"></i></template>
            <template x-if="wf.status === 'failed'"><i class="fa fa-triangle-exclamation"></i></template>
            <template x-if="wf.status === 'pending'"><i class="fa fa-clock"></i></template>
          </div>
          <div style="flex:1; min-width:0;">
            <div class="wf-item-title" x-text="wf.run_title || wf.run_id"></div>
            <div class="wf-item-time" x-text="formatRelTime(wf.created_at)"></div>
          </div>
          <button class="wf-delete" @click.stop="confirmDeleteWorkflow(wf.run_id)" title="Delete">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </template>

      <!-- Hub -->
      <div class="sidebar-section-label" style="margin-top:6px;">Hub</div>
      <button class="hub-item" :class="{ active: currentView === 'templates' }" @click="currentView = 'templates'; activeRunId = null" style="width:100%; text-align:left;">
        <i class="fa fa-robot"></i> Agent Templates
      </button>
      <a href="/settings" class="hub-item">
        <i class="fa fa-sliders"></i> Settings
      </a>
    </div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <div class="admin-avatar">K</div>
      <div style="flex:1; min-width:0;">
        <div class="admin-name">Admin</div>
        <div class="admin-role">Operator</div>
      </div>
      <a href="/settings" class="gear-btn"><i class="fa fa-gear"></i></a>
    </div>
  </aside>

  <!-- ═══════════════ MAIN PANEL ═══════════════ -->
  <main id="atlas-main">

    <!-- Topbar -->
    <div id="atlas-topbar">
      <div class="topbar-title" x-text="topbarTitle()"></div>

      <!-- Model selector -->
      <div class="model-select-wrap">
        <select class="model-select" x-model="selectedModel" @change="updateModel()">
          <template x-if="models.length === 0">
            <option :value="selectedModel" x-text="selectedModel" selected></option>
          </template>
          <template x-for="m in models" :key="m.id">
            <option :value="m.id" x-text="m.name || m.id" :selected="m.id === selectedModel"
                    style="background:var(--bg-canvas); color:var(--text-primary);"></option>
          </template>
        </select>
      </div>

      <!-- Status badge -->
      <template x-if="activeWorkflow">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="status-badge" :class="'status-' + (activeWorkflow.status || 'pending')">
            <template x-if="activeWorkflow.status === 'running'"><i class="fa fa-circle-notch spinner-sm"></i></template>
            <span x-text="activeWorkflow.status || 'pending'"></span>
          </span>
          
          <!-- Stop / Restart buttons in topbar -->
          <template x-if="activeWorkflow.status === 'running'">
            <button @click.stop="stopWorkflow()" title="Force Stop Workflow" style="background: rgba(255, 107, 107, 0.15); border: 1px solid rgba(255, 107, 107, 0.3); color: #ff6b6b; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s;" x-on:mouseover="$el.style.background='rgba(255,107,107,0.25)'" x-on:mouseout="$el.style.background='rgba(255,107,107,0.15)'">
              <i class="fa fa-stop"></i> Stop
            </button>
          </template>
          <template x-if="activeWorkflow.status === 'failed' || activeWorkflow.status === 'completed'">
            <button @click.stop="restartWorkflow()" title="Restart Workflow" style="background: rgba(111, 207, 151, 0.15); border: 1px solid rgba(111, 207, 151, 0.3); color: #6fcf97; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s;" x-on:mouseover="$el.style.background='rgba(111,207,151,0.25)'" x-on:mouseout="$el.style.background='rgba(111,207,151,0.15)'">
              <i class="fa fa-rotate-right"></i> Restart
            </button>
          </template>
        </div>
      </template>

      <!-- Debug toggle -->
      <template x-if="activeRunId">
        <button class="topbar-btn" :class="{ active: debugMode }" @click="debugMode = !debugMode">
          <i class="fa fa-bug"></i> Debug
        </button>
      </template>

      <!-- Tab: overview / graph / files -->
      <template x-if="activeRunId">
        <div style="display:flex; gap:4px; background:var(--bg-input); border:1px solid var(--border); border-radius:10px; padding:3px; align-items:center;">
          <button class="topbar-btn" :class="{ active: activeTab === 'overview' }" @click="activeTab='overview'" style="border:none; border-radius:6px; font-size:12px; padding:6px 12px; height:28px;">
            <i class="fa fa-grip"></i> List
          </button>
          <button class="topbar-btn" :class="{ active: activeTab === 'graph' }" @click="activeTab='graph'" style="border:none; border-radius:6px; font-size:12px; padding:6px 12px; height:28px;">
            <i class="fa-solid fa-circle-nodes"></i> Graph
          </button>
          <button class="topbar-btn" :class="{ active: activeTab === 'files' }" @click="activeTab='files'; loadFiles()" style="border:none; border-radius:6px; font-size:12px; padding:6px 12px; height:28px;">
            <i class="fa fa-folder"></i> Files
          </button>
        </div>
      </template>
    </div>

    <!-- Content -->
    <div id="atlas-content">

      <!-- ── EMPTY STATE ── -->
      <template x-if="!activeRunId && !submitting && currentView === 'home'">
        <div class="atlas-view-enter">
          <div class="empty-hero">
            <div class="empty-hero-icon"><i class="fa fa-terminal"></i></div>
            <div style="font-size:22px; font-weight:700; letter-spacing:-0.03em; color:var(--text-primary); margin-bottom:8px;">Atlas Multi-Agent Terminal</div>
            <div style="font-size:14px; color:var(--text-tertiary); margin-bottom:28px; line-height:1.6;">
              Describe a complex task and Atlas will decompose it into specialized agents — researcher, writer, browser, coder, PDF worker — and execute them in parallel.
            </div>
          </div>

          <!-- Suggestions grid -->
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; max-width:720px; margin:0 auto;">
            <template x-for="s in suggestions" :key="s.text">
              <div class="suggestion-card" @click="fillAndSubmit(s.text)">
                <div style="width:36px; height:36px; border-radius:12px; background:var(--accent-subtle); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  <i :class="'fa ' + s.icon" style="color:var(--accent); font-size:15px;"></i>
                </div>
                <div>
                  <div style="font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:3px;" x-text="s.title"></div>
                  <div style="font-size:11.5px; color:var(--text-tertiary); line-height:1.4;" x-text="s.desc"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ── AGENTIC SUPERVISOR PLANNING SCREEN ── -->
      <template x-if="!activeRunId && submitting && currentView === 'home'">
        <div class="atlas-view-enter" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; padding: 40px; text-align: center;">
          
          <!-- Cyber Intel Loader Box -->
          <div class="cyber-loader-box">
            <div class="cyber-glow-border"></div>
            
            <div class="cyber-body">
              <!-- Holographic Brain Core -->
              <div class="holo-core-container">
                <div class="holo-radar-ring ring-1"></div>
                <div class="holo-radar-ring ring-2"></div>
                <div class="holo-radar-ring ring-3"></div>
                <i class="fa-solid fa-brain holo-brain"></i>
              </div>
              
              <div class="cyber-header-tag">
                <span class="cyber-pulse-dot"></span>
                DECOMPOSING REQUEST
              </div>
              
              <div class="cyber-step-text" x-text="planningSubtitle()"></div>
            </div>
          </div>
          
          <div style="margin-top: 24px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase;">
            Designing specialized agent mesh & dependency execution pipelines...
          </div>
        </div>
      </template>

      <!-- ── WORKFLOW OVERVIEW ── -->
      <template x-if="activeRunId && currentView === 'home' && activeTab === 'overview'">
        <div class="atlas-view-enter">

          <!-- Goal card -->
          <template x-if="activeWorkflow && activeWorkflow.plan">
            <div class="goal-card">
              <div class="goal-icon"><i :class="'fa-solid ' + (activeWorkflow.run_icon || 'fa-bullseye')"></i></div>
              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-tertiary); margin-bottom:4px;">Goal</div>
                <div style="font-size:14px; font-weight:600; color:var(--text-primary); line-height:1.5;" x-text="activeWorkflow.plan.goal || '—'"></div>
              </div>
            </div>
          </template>

          <!-- Task grid -->
          <template x-if="activeWorkflow && activeWorkflow.tasks && activeWorkflow.tasks.length">
            <div>
              <div class="section-header">
                <div class="section-title"><i class="fa fa-diagram-project"></i> Tasks</div>
                <div style="font-size:11px; color:var(--text-quaternary);" x-text="activeWorkflow.tasks.length + ' agents'"></div>
              </div>
              <div class="task-grid">
                <template x-for="task in activeWorkflow.tasks" :key="task.task_id">
                  <div class="task-card"
                    :class="taskCardClass(task.status)"
                    @click="openTaskModal(task)"
                    style="position: relative;">
                    <!-- Active worker spinning badge -->
                    <template x-if="getTaskDisplayStatus(task) === 'working'">
                      <div class="active-worker-badge">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                      </div>
                    </template>
                    <!-- Sleeping/Waiting badge -->
                    <template x-if="getTaskDisplayStatus(task) === 'waiting'">
                      <div class="active-worker-badge waiting-badge" title="Waiting for dependencies...">
                        <i class="fa-solid fa-moon"></i>
                      </div>
                    </template>
                    <div style="display:flex; align-items:flex-start; gap:10px; margin-bottom:8px;">
                      <div class="task-worker-icon" :style="workerIconStyle(task.worker_type)">
                        <i :class="'fa ' + workerIcon(task.worker_type)"></i>
                      </div>
                      <div style="flex:1; min-width:0;">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                          <div class="task-title" x-text="task.title"></div>
                          <template x-if="task.timestamps && task.timestamps.start">
                            <span class="timer-badge" :class="{ 'timer-running': task.status === 'running' }">
                              <i class="fa-solid fa-stopwatch"></i>
                              <span x-text="taskDuration(task)"></span>
                            </span>
                          </template>
                        </div>
                        <div class="task-desc" x-text="task.description"></div>
                      </div>
                    </div>
                    <div class="task-footer" style="display:flex; flex-wrap:wrap; gap:6px;">
                      <span class="status-badge" :class="'status-' + (task.status || 'pending')" style="font-size:10px; padding:2px 8px;">
                        <template x-if="task.status === 'running' || task.status === 'retrying'"><i class="fa fa-circle-notch spinner-sm" style="font-size:9px;"></i></template>
                        <span x-text="task.status || 'pending'"></span>
                      </span>
                      
                      <!-- Recovery Stats -->
                      <template x-if="task.attempt_count && task.attempt_count > 0">
                        <span style="font-size:10px; color:var(--text-tertiary); display:flex; align-items:center; gap:4px; padding:2px 6px; background:rgba(255,165,0,0.1); border-radius:4px; border:1px solid rgba(255,165,0,0.2);" :title="'Recovery decision: ' + (task.recovery_decision || 'none')">
                          <i class="fa fa-rotate-left" style="font-size:9px;"></i> Retry <span x-text="task.attempt_count"></span>
                        </span>
                      </template>
                      
                      <template x-if="task.failure_type && task.status.startsWith('failed')">
                        <span style="font-size:10px; color:#ff6b6b; display:flex; align-items:center; gap:4px; padding:2px 6px; background:rgba(255,107,107,0.1); border-radius:4px; border:1px solid rgba(255,107,107,0.2);" :title="task.error">
                          <i class="fa fa-triangle-exclamation" style="font-size:9px;"></i>
                          <span x-text="task.failure_type"></span>
                        </span>
                      </template>

                      <template x-if="task.depends_on && task.depends_on.length">
                        <span style="font-size:10px; color:var(--text-quaternary); display:flex; align-items:center; gap:4px;">
                          <i class="fa fa-arrow-right" style="font-size:9px;"></i>
                          <span x-text="task.depends_on.join(', ')"></span>
                        </span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Debug panel -->
          <template x-if="debugMode && activeWorkflow && activeWorkflow.debug_logs && activeWorkflow.debug_logs.length">
            <div x-transition>
              <div class="section-header">
                <div class="section-title"><i class="fa fa-bug"></i> Debug Logs</div>
                <span style="font-size:11px; color:var(--text-quaternary);" x-text="activeWorkflow.debug_logs.length + ' entries'"></span>
              </div>
              <div class="debug-console" x-ref="debugConsole">
                <template x-for="(log, i) in activeWorkflow.debug_logs" :key="i">
                  <div class="debug-line">
                    <span x-text="typeof log === 'string' ? log : (log.message || JSON.stringify(log))"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Console/Notifications -->
          <template x-if="activeWorkflow && activeWorkflow.notifications">
            <div>
              <div class="section-header">
                <div class="section-title"><i class="fa fa-terminal"></i> Console</div>
                <span style="font-size:11px; color:var(--text-quaternary);" x-text="(activeWorkflow.notifications || []).length + ' events'"></span>
              </div>
              <div class="atlas-console" x-ref="consoleEl">
                <template x-if="!activeWorkflow.notifications || activeWorkflow.notifications.length === 0">
                  <div style="color:rgba(134,134,172,0.4); font-size:11px;">Waiting for output...</div>
                </template>
                <template x-for="(n, i) in activeWorkflow.notifications" :key="i">
                  <div class="console-line">
                    <span :class="consoleClass(typeof n === 'string' ? n : '')" x-text="typeof n === 'string' ? n : (n.message || JSON.stringify(n))"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Artifacts -->
          <template x-if="activeWorkflow && activeWorkflow.status === 'completed' && activeWorkflow.artifacts && activeWorkflow.artifacts.length">
            <div style="margin-bottom:16px;">
              <div class="section-header">
                <div class="section-title"><i class="fa fa-paperclip"></i> Artifacts</div>
              </div>
              <div>
                <template x-for="(art, i) in activeWorkflow.artifacts" :key="i">
                  <a :href="getArtifactDownloadUrl(art)"
                     download class="artifact-chip">
                    <i :class="'fa ' + fileIcon(art)"></i>
                    <span x-text="artFilename(art)"></span>
                    <i class="fa fa-download" style="font-size:10px; opacity:0.6;"></i>
                  </a>
                </template>
              </div>
            </div>
          </template>

          <!-- Final result -->
          <template x-if="activeWorkflow && activeWorkflow.final_result">
            <div class="atlas-card">
              <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-tertiary); margin-bottom:10px;">
                <i class="fa fa-flag-checkered"></i> Final Result
              </div>
              <div class="chat-prose" x-html="renderMd(activeWorkflow.final_result)"></div>
            </div>
          </template>
        </div>
      </template>

      <!-- ── GRAPH VIEW ── -->
      <template x-if="activeRunId && currentView === 'home' && activeTab === 'graph'">
        <div class="atlas-view-enter">
          <!-- Goal card -->
          <template x-if="activeWorkflow && activeWorkflow.plan">
            <div class="goal-card" style="margin-bottom: 16px;">
              <div class="goal-icon"><i :class="'fa-solid ' + (activeWorkflow.run_icon || 'fa-bullseye')"></i></div>
              <div>
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-tertiary); margin-bottom:4px;">Goal</div>
                <div style="font-size:14px; font-weight:600; color:var(--text-primary); line-height:1.5;" x-text="activeWorkflow.plan.goal || '—'"></div>
              </div>
            </div>
          </template>

          <div class="graph-container" style="position: relative;" @mousedown="startPan($event)">
            <!-- Floating Apple-style Duration Pill Overlay -->
            <template x-if="activeWorkflow && (activeWorkflow.started_at || activeWorkflow.created_at)">
              <div style="position: absolute; top: 16px; right: 16px; z-index: 20; display: flex; align-items: center; gap: 8px; background: rgba(39,39,87,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(134,134,172,0.25); border-radius: 99px; padding: 6px 14px; box-shadow: 0 8px 32px rgba(15,14,71,0.35); pointer-events: auto; transition: all 0.3s ease;">
                <!-- Glowing heartbeat pulse or icon depending on status -->
                <span style="display: flex; align-items: center; justify-content: center; pointer-events: none;">
                  <template x-if="activeWorkflow.status === 'running'">
                    <span style="position: relative; display: flex; height: 8px; width: 8px;">
                      <span style="position: absolute; display: inline-flex; height: 100%; width: 100%; border-radius: 9999px; background-color: #6fcf97; opacity: 0.75; animation: simple-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;"></span>
                      <span style="position: relative; display: inline-flex; border-radius: 9999px; height: 8px; width: 8px; background-color: #6fcf97;"></span>
                    </span>
                  </template>
                  <template x-if="activeWorkflow.status === 'completed'">
                    <i class="fa fa-circle-check" style="color: #6fcf97; font-size: 11px;"></i>
                  </template>
                  <template x-if="activeWorkflow.status === 'failed'">
                    <i class="fa fa-circle-exclamation" style="color: #ff6b6b; font-size: 11px;"></i>
                  </template>
                  <template x-if="activeWorkflow.status === 'pending'">
                    <i class="fa fa-circle-notch fa-spin" style="color: var(--text-tertiary); font-size: 11px;"></i>
                  </template>
                </span>
                
                <!-- Label and duration text -->
                <span style="font-size: 11px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 4px; pointer-events: none;">
                  Time: <span style="font-weight: 700; color: var(--text-primary); font-family: monospace;" x-text="getWorkflowDurationText(activeWorkflow, currentTime)"></span>
                </span>
                
                <!-- Action Buttons -->
                <template x-if="activeWorkflow.status === 'running'">
                  <button @click.stop="stopWorkflow()" title="Force Stop Workflow" style="background: rgba(255, 107, 107, 0.15); border: 1px solid rgba(255, 107, 107, 0.3); color: #ff6b6b; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; cursor: pointer; margin-left: 4px; transition: all 0.2s;" x-on:mouseover="$el.style.background='rgba(255,107,107,0.25)'" x-on:mouseout="$el.style.background='rgba(255,107,107,0.15)'">
                    <i class="fa fa-stop" style="margin-right: 3px;"></i> Stop
                  </button>
                </template>
                <template x-if="activeWorkflow.status === 'failed' || activeWorkflow.status === 'completed'">
                  <button @click.stop="restartWorkflow()" title="Restart Workflow" style="background: rgba(111, 207, 151, 0.15); border: 1px solid rgba(111, 207, 151, 0.3); color: #6fcf97; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; cursor: pointer; margin-left: 4px; transition: all 0.2s;" x-on:mouseover="$el.style.background='rgba(111,207,151,0.25)'" x-on:mouseout="$el.style.background='rgba(111,207,151,0.15)'">
                    <i class="fa fa-rotate-right" style="margin-right: 3px;"></i> Restart
                  </button>
                </template>
              </div>
            </template>

            <div class="graph-canvas" :style="'transform: scale(' + zoomLevel + '); transform-origin: top left;'">
              <!-- SVG connector paths -->
              <svg style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">
                <defs>
                  <marker id="arrow-pending" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="rgba(134,134,172,0.3)"/>
                  </marker>
                  <marker id="arrow-running" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
                  </marker>
                  <marker id="arrow-completed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e"/>
                  </marker>
                  <marker id="arrow-failed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
                  </marker>
                </defs>
                
                <g x-html="renderSvgEdges()"></g>
              </svg>

              <!-- Node Cards -->
              <template x-for="n in getGraphLayout().nodes" :key="n.id">
                <div class="graph-node"
                     :class="['node-' + getTaskDisplayStatus(n.task), draggingNode === n.id ? 'dragging' : '']"
                     :style="'left: ' + n.x + 'px; top: ' + n.y + 'px; cursor: ' + (draggingNode === n.id ? 'grabbing' : 'grab') + ';'"
                     @mousedown.stop="startDragNode($event, n.id)"
                     @click="if (draggingNode !== n.id) openTaskModal(n.task)">
                  <div class="graph-node-icon" :style="workerIconStyle(n.task.worker_type)">
                    <i :class="'fa ' + workerIcon(n.task.worker_type)"></i>
                  </div>
                  <div class="graph-node-title" x-text="n.task.title"></div>
                  
                  <!-- Active worker badge with spinner -->
                  <template x-if="getTaskDisplayStatus(n.task) === 'working'">
                    <div class="active-worker-badge">
                      <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                  </template>

                  <!-- Sleeping/Waiting badge -->
                  <template x-if="getTaskDisplayStatus(n.task) === 'waiting'">
                    <div class="active-worker-badge waiting-badge" title="Waiting for dependencies...">
                      <i class="fa-solid fa-moon"></i>
                    </div>
                  </template>

                  <!-- Downward connector arrow & Artifact download pills underneath the node -->
                  <template x-if="n.task.artifacts && n.task.artifacts.length">
                    <div class="node-artifacts-container" @click.stop>
                      <div class="artifact-arrow"><i class="fa-solid fa-arrow-down-long"></i></div>
                      <template x-for="art in n.task.artifacts" :key="art">
                        <a :href="getArtifactDownloadUrl(art)" 
                           download
                           class="node-artifact-pill"
                           :title="'Download ' + getFilename(art)">
                          <i :class="'fa ' + getArtifactIcon(art)"></i>
                          <span x-text="truncateFilename(getFilename(art), 16)"></span>
                        </a>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Dynamic Floating Zoom Controls (Static to graph container) -->
            <div class="zoom-controls">
              <button class="zoom-btn" @click="zoomOut()" title="Zoom Out"><i class="fa fa-minus"></i></button>
              <span class="zoom-text" x-text="Math.round(zoomLevel * 100) + '%'"></span>
              <button class="zoom-btn" @click="zoomIn()" title="Zoom In"><i class="fa fa-plus"></i></button>
              <button class="zoom-btn" @click="resetZoom()" title="Reset Zoom"><i class="fa-solid fa-compress"></i></button>
            </div>
          </div>
        </div>
      </template>

      <!-- ── FILE EXPLORER ── -->
      <template x-if="activeRunId && activeTab === 'files'">
        <div class="atlas-view-enter">
          
          <!-- Nautilus-like Toolbar -->
          <div class="nautilus-toolbar">
            <!-- Breadcrumbs trail -->
            <div class="nautilus-breadcrumbs">
              <template x-for="(crumb, idx) in getBreadcrumbs()" :key="idx">
                <div style="display:inline-flex; align-items:center; gap:4px;">
                  <span class="breadcrumb-pill" 
                        :class="{ active: currentDirPath === crumb.path }"
                        @click="navigateToPath(crumb.path)"
                        x-text="crumb.name"></span>
                  <template x-if="idx < getBreadcrumbs().length - 1">
                    <span class="breadcrumb-divider">/</span>
                  </template>
                </div>
              </template>
            </div>
            
            <!-- Explorer action buttons -->
            <div style="display:flex; gap:8px; align-items:center;">
              <button class="action-btn-sm" @click="makeFolder()" title="Create Folder">
                <i class="fa fa-folder-plus"></i> New Folder
              </button>
              <button class="action-btn-sm" @click="makeFile()" title="Create Empty File">
                <i class="fa fa-file-circle-plus"></i> New File
              </button>
              <button class="action-btn-sm" @click="downloadZip()" title="Download Workspace as ZIP">
                <i class="fa-solid fa-file-zipper"></i> Download ZIP
              </button>
              <button class="action-btn-sm primary" @click="$refs.fileInput.click()" title="Upload File">
                <i class="fa fa-upload"></i> Upload
              </button>
              <input type="file" x-ref="fileInput" style="display:none" @change="uploadFile($event)">
              
              <!-- Divider -->
              <div style="width:1px; height:18px; background:var(--border); margin:0 4px;"></div>
              
              <!-- View mode switcher -->
              <button class="action-btn-sm" @click="fileViewMode = (fileViewMode === 'grid' ? 'list' : 'grid')" title="Toggle view mode">
                <i :class="fileViewMode === 'grid' ? 'fa-solid fa-list' : 'fa-solid fa-grip'"></i>
              </button>
              <button class="action-btn-sm" @click="loadFiles()" title="Refresh directory">
                <i class="fa fa-rotate-right"></i>
              </button>
            </div>
          </div>

          <!-- Files and directories container -->
          <div class="atlas-card" style="padding: 16px 20px;">
            <template x-if="filesLoading">
              <div style="text-align:center; padding:36px; color:var(--text-tertiary); font-size:13px;">
                <i class="fa fa-circle-notch spinner"></i> Loading files…
              </div>
            </template>
            
            <template x-if="!filesLoading && workflowFiles.length === 0">
              <div style="text-align:center; padding:36px; color:var(--text-quaternary); font-size:13px;">
                <i class="fa-solid fa-folder-open" style="font-size:24px; margin-bottom:8px; display:block; opacity:0.4;"></i>
                Empty Folder
              </div>
            </template>

            <template x-if="!filesLoading && workflowFiles.length > 0">
              <div>
                <!-- Nautilus Grid View -->
                <template x-if="fileViewMode === 'grid'">
                  <div class="nautilus-grid">
                    <template x-for="f in workflowFiles" :key="f.name">
                      <div class="nautilus-item" 
                           @click="f.is_dir ? navigateToFolder(f.name) : null"
                           @dblclick="f.is_dir ? navigateToFolder(f.name) : window.open(getFileUrl(f.name), '_blank')">
                        <!-- Icon -->
                        <div class="nautilus-item-icon">
                          <template x-if="f.is_dir">
                            <i class="fa-solid fa-folder" style="color:#b8922a;"></i>
                          </template>
                          <template x-if="!f.is_dir">
                            <i :class="'fa-solid ' + fileIcon(f.name)" :style="'color:' + (f.name.endsWith('.pdf') ? '#d03a3a' : '#505081') + ';'"></i>
                          </template>
                        </div>
                        <!-- Details -->
                        <div class="nautilus-item-name" x-text="f.name" :title="f.name"></div>
                        <template x-if="!f.is_dir">
                          <div class="nautilus-item-size" x-text="formatBytes(f.size)"></div>
                        </template>
                        <template x-if="f.is_dir">
                          <div class="nautilus-item-size" style="color:var(--text-quaternary);">Folder</div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Nautilus List View -->
                <template x-if="fileViewMode === 'list'">
                  <div>
                    <template x-for="f in workflowFiles" :key="f.name">
                      <div class="file-row" style="cursor:pointer;" 
                           @click="f.is_dir ? navigateToFolder(f.name) : null"
                           @dblclick="f.is_dir ? navigateToFolder(f.name) : window.open(getFileUrl(f.name), '_blank')">
                        <div class="file-icon">
                          <template x-if="f.is_dir">
                            <i class="fa-solid fa-folder" style="color:#b8922a;"></i>
                          </template>
                          <template x-if="!f.is_dir">
                            <i :class="'fa-solid ' + fileIcon(f.name)" :style="'color:' + (f.name.endsWith('.pdf') ? '#d03a3a' : '#505081') + ';'"></i>
                          </template>
                        </div>
                        <div class="file-name" x-text="f.name"></div>
                        <template x-if="!f.is_dir">
                          <div class="file-size" x-text="formatBytes(f.size)"></div>
                          <a :href="getFileUrl(f.name)" target="_blank" class="file-dl" style="margin-left: 8px;">
                            <i class="fa fa-arrow-down-to-line"></i>
                          </a>
                        </template>
                        <template x-if="f.is_dir">
                          <div class="file-size" style="color:var(--text-quaternary);">Folder</div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
          
        </div>
      </template>

      <!-- ── TEMPLATES VIEW ── -->
      <template x-if="currentView === 'templates'">
        <div class="atlas-view-enter">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;">
            <div>
              <div style="font-size:20px; font-weight:700; letter-spacing:-0.03em; color:var(--text-primary);">Agent Templates</div>
              <div style="font-size:13px; color:var(--text-tertiary); margin-top:2px;">Manage and create custom agent definitions</div>
            </div>
            <button class="action-btn-sm primary" @click="toggleTemplateForm()">
              <i :class="'fa ' + (showTemplateForm ? 'fa-xmark' : 'fa-plus')"></i>
              <span x-text="showTemplateForm ? 'Close' : 'Create New'"></span>
            </button>
          </div>

          <!-- Create form -->
          <template x-if="showTemplateForm">
            <div class="atlas-card" x-transition style="margin-bottom:20px;">
              <div style="font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:14px;">
                <i class="fa fa-robot" style="color:var(--accent);"></i> <span x-text="tplIsEdit ? 'Edit Agent Template' : 'New Agent Template'"></span>
              </div>

              <!-- AI Generate (Only for new creations) -->
              <template x-if="!tplIsEdit">
                <div style="display:flex; gap:8px; margin-bottom:16px;">
                  <input type="text" class="apple-field" style="border-radius:10px;"
                    placeholder="Describe agent in plain language, e.g. 'An agent that scrapes news and summarizes them'"
                    x-model="tplGenDesc">
                  <button class="action-btn-sm primary" @click="generateTemplate()" :disabled="tplGenerating" style="flex-shrink:0; white-space:nowrap;">
                    <template x-if="tplGenerating"><i class="fa fa-circle-notch spinner-sm"></i></template>
                    <template x-if="!tplGenerating"><i class="fa fa-wand-magic-sparkles"></i></template>
                    <span>Generate with AI</span>
                  </button>
                </div>
              </template>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
                <div>
                  <label class="apple-label">Template ID</label>
                  <input type="text" class="apple-field" placeholder="e.g. news_scraper" x-model="tplForm.id" :disabled="tplIsEdit" :style="tplIsEdit ? 'opacity:0.6; cursor:not-allowed;' : ''">
                </div>
                <div>
                  <label class="apple-label">Name</label>
                  <input type="text" class="apple-field" placeholder="e.g. News Scraper" x-model="tplForm.name">
                </div>
              </div>
              <div style="margin-bottom:12px;">
                <label class="apple-label">Purpose</label>
                <input type="text" class="apple-field" placeholder="Short description of what this agent does" x-model="tplForm.purpose">
              </div>
              <div style="margin-bottom:12px;">
                <label class="apple-label">System Prompt</label>
                <textarea class="apple-field" rows="5" placeholder="You are a specialized agent that..." x-model="tplForm.system_prompt_template" style="resize:vertical;"></textarea>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
                <div>
                  <label class="apple-label">Timeout (seconds)</label>
                  <input type="number" class="apple-field" placeholder="300" x-model="tplForm.timeout">
                </div>
                <div>
                  <label class="apple-label">Max Retries</label>
                  <input type="number" class="apple-field" placeholder="3" x-model="tplForm.retry_limit">
                </div>
              </div>
              <div style="margin-bottom:16px;">
                <label class="apple-label">Allowed Tools</label>
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                  <template x-for="tool in availableTools" :key="tool.id">
                    <label :title="tool.description" style="display:flex; align-items:center; gap:5.5px; font-size:12.5px; color:var(--text-secondary); cursor:pointer; background:var(--bg-input); border:1px solid var(--border); border-radius:8px; padding:5.5px 11px; transition: all 0.2s ease;" class="hover:bg-white/5 dark:hover:bg-white/10">
                      <input type="checkbox" class="tool-checkbox" :value="tool.id"
                        :checked="tplForm.allowed_tools.includes(tool.id)"
                        @change="toggleTool(tool.id)">
                      <span x-text="tool.name"></span>
                    </label>
                  </template>
                </div>
              </div>
              <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="action-btn-sm" @click="toggleTemplateForm()">Cancel</button>
                <button class="action-btn-sm primary" @click="saveTemplate()">
                  <i class="fa fa-floppy-disk"></i> Save Template
                </button>
              </div>
            </div>
          </template>

          <!-- Templates grid -->
          <template x-if="templatesLoading">
            <div style="text-align:center; padding:40px; color:var(--text-tertiary);">
              <i class="fa fa-circle-notch spinner fa-lg"></i>
              <div style="margin-top:10px; font-size:13px;">Loading templates…</div>
            </div>
          </template>
          <template x-if="!templatesLoading && Object.keys(templates).length === 0">
            <div style="text-align:center; padding:40px; color:var(--text-quaternary); font-size:13px;">
              No templates found. Create one above.
            </div>
          </template>
          <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;">
            <template x-for="(tpl, id) in templates" :key="id">
              <div class="template-card">
                <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px;">
                  <div>
                    <div style="font-size:14px; font-weight:700; color:var(--text-primary);" x-text="tpl.name || id"></div>
                    <div style="font-size:11px; color:var(--text-tertiary); margin-top:1px;" x-text="id"></div>
                  </div>
                  <div style="display:flex; gap:6px;">
                    <button class="action-btn-sm" @click="editTemplate(id, tpl)" style="padding:4px 7px; border-radius:7px; background:rgba(80, 80, 129, 0.15); border:1px solid rgba(80, 80, 129, 0.25); color:var(--text-primary);">
                      <i class="fa fa-pencil"></i>
                    </button>
                    <button class="action-btn-sm danger" @click="deleteTemplate(id)" style="padding:4px 7px; border-radius:7px;">
                      <i class="fa fa-trash"></i>
                    </button>
                  </div>
                </div>
                <div style="font-size:12px; color:var(--text-secondary); margin-bottom:10px; line-height:1.4;" x-text="tpl.purpose || '—'"></div>
                <div>
                  <template x-if="tpl.allowed_tools && tpl.allowed_tools.length">
                    <div>
                      <template x-for="tool in (tpl.allowed_tools || []).slice(0,4)" :key="tool">
                        <span class="tool-badge" x-text="tool"></span>
                      </template>
                      <template x-if="(tpl.allowed_tools || []).length > 4">
                        <span class="tool-badge" x-text="'+' + ((tpl.allowed_tools || []).length - 4)"></span>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

    </div><!-- /atlas-content -->

    <!-- ── Input bar ── -->
    <div id="atlas-inputbar">
      <!-- Supervisor Indicator Pill -->
      <template x-if="activeRunId && activeWorkflow">
        <div style="display:flex; justify-content:center; margin-bottom:8px;" x-transition>
          <div style="display:inline-flex; align-items:center; gap:6px; background:var(--accent-subtle); color:var(--accent); font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; border:1px solid rgba(80,80,129,0.15);">
            <i class="fa-solid fa-comments"></i>
            <span>Chatting with <span x-text="activeWorkflow.run_title || activeWorkflow.run_id" style="font-weight:700;"></span> Supervisor</span>
            <button @click="clearActive()" style="background:none; border:none; color:var(--accent); opacity:0.6; cursor:pointer; margin-left:4px; padding:0; display:inline-flex; align-items:center;" title="Exit chat">
              <i class="fa fa-xmark" style="font-size:10px;"></i>
            </button>
          </div>
        </div>
      </template>

      <div class="input-wrap">
        <button class="input-action-btn" @click="$refs.attachInput.click()" title="Attach file">
          <i class="fa fa-paperclip"></i>
        </button>
        <input type="file" x-ref="attachInput" style="display:none" @change="handleAttach($event)">
        <textarea class="atlas-input"
          :placeholder="activeRunId ? 'Send a message/instruction to the workflow supervisor…' : 'Describe a workflow to run, or ask Atlas anything…'"
          x-model="inputText"
          x-ref="mainInput"
          @keydown.enter.exact.prevent="submitWorkflow()"
          @keydown.enter.shift.exact="null"
          @input="autoResize($refs.mainInput)"
          rows="1"></textarea>
        <button class="submit-btn" @click="submitWorkflow()" :disabled="!inputText.trim() || submitting" title="Send message">
          <template x-if="submitting"><i class="fa fa-circle-notch spinner" style="font-size:13px;"></i></template>
          <template x-if="!submitting">
            <i :class="activeRunId ? 'fa-solid fa-paper-plane' : 'fa-solid fa-rocket'" style="font-size:13px;"></i>
          </template>
        </button>
      </div>
      <div style="text-align:center; font-size:10px; color:var(--text-quaternary); margin-top:6px;">
        Atlas · Multi-Agent Execution · <span x-text="selectedModel"></span>
      </div>
    </div>

  </main><!-- /atlas-main -->

  <!-- ═══════════════ TASK MODAL ═══════════════ -->
  <template x-if="selectedTask">
    <div class="modal-backdrop"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      @click.self="selectedTask = null">
      <div class="modal-box"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95 translate-y-2"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95">
        <button class="modal-close" @click="selectedTask = null"><i class="fa fa-xmark"></i></button>

        <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px; padding-right:36px;">
          <div class="task-worker-icon" :style="workerIconStyle(selectedTask.worker_type)" style="width:40px; height:40px; border-radius:12px;">
            <i :class="'fa ' + workerIcon(selectedTask.worker_type)" style="font-size:16px;"></i>
          </div>
          <div>
            <div style="font-size:17px; font-weight:700; letter-spacing:-0.02em; color:var(--text-primary);" x-text="selectedTask.title"></div>
            <div style="font-size:12px; color:var(--text-tertiary);" x-text="selectedTask.task_id + ' · ' + (selectedTask.worker_type || '')"></div>
          </div>
          <span class="status-badge" :class="'status-' + (selectedTask.status || 'pending')" style="margin-left:auto;">
            <span x-text="selectedTask.status || 'pending'"></span>
          </span>
        </div>

        <div style="margin-bottom:14px;">
          <div style="font-size:12px; font-weight:600; color:var(--text-tertiary); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em;">Description</div>
          <div style="font-size:13px; color:var(--text-secondary); line-height:1.5;" x-text="selectedTask.description || '—'"></div>
        </div>

        <template x-if="selectedTask.allowed_tools && selectedTask.allowed_tools.length">
          <div style="margin-bottom:14px;">
