<!-- ═══ COMPONENT: AI Personas Tab ═══ -->
<div class="store-tab-content" x-show="sidebarTab === 'personas'">
    <div class="store-header">
        <div class="store-title-area">
            <h1>Personas</h1>
            <p>Custom-crafted character templates and expert agent profiles.</p>
        </div>
    </div>

    <section class="store-section">
        <div class="apps-grid">
            <template x-for="app in getFilteredApps('character')" :key="app.id">
                {% include "app-store/components/app_card.html" %}
            </template>
        </div>
        
        <template x-if="getFilteredApps('character').length === 0">
            <div style="text-align: center; padding: 48px; color: var(--text-tertiary);">
                <i class="fa-solid fa-magnifying-glass" style="font-size: 32px; margin-bottom: 16px; display: block; opacity: 0.5;"></i>
                <p style="font-size: 15px; margin: 0;">No personas found matching "<span x-text="searchQ"></span>"</p>
            </div>
        </template>
    </section>
</div>
